<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!--
    Favicon version of The Site of Many Things logo.
    Designed to read clearly at 16x16, 32x32, and 48x48.
    Stripped to essentials: scroll center + 8 orbit dots.
    No outer ring, no text, no orbit ring dashes — too fine at small sizes.
    Place this file as /public/favicon.svg in your project.
    Also recommended: generate a favicon.ico from this at 32x32 and 16x16.
  -->

  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="15.5" fill="#0A0812"/>
  <circle cx="16" cy="16" r="15.5" fill="none" stroke="#7040B8" stroke-width="0.8" opacity="0.7"/>

  <!-- Orbit ring (solid, thin — dashes too small at this size) -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#7040B8" stroke-width="0.6" opacity="0.5"/>

  <!-- 8 Spokes -->
  <line x1="16" y1="12.2" x2="16" y2="7.2" stroke="#7040B8" stroke-width="0.5" opacity="0.7"/>
  <line x1="18.5" y1="13.3" x2="22.1" y2="9.7" stroke="#7040B8" stroke-width="0.5" opacity="0.7"/>
  <line x1="19.7" y1="16" x2="24.7" y2="16" stroke="#7040B8" stroke-width="0.5" opacity="0.7"/>
  <line x1="18.5" y1="18.7" x2="22.1" y2="22.3" stroke="#7040B8" stroke-width="0.5" opacity="0.7"/>
  <line x1="16" y1="19.8" x2="16" y2="24.8" stroke="#7040B8" stroke-width="0.5" opacity="0.7"/>
  <line x1="13.5" y1="18.7" x2="9.9" y2="22.3" stroke="#7040B8" stroke-width="0.5" opacity="0.7"/>
  <line x1="12.3" y1="16" x2="7.3" y2="16" stroke="#7040B8" stroke-width="0.5" opacity="0.7"/>
  <line x1="13.5" y1="13.3" x2="9.9" y2="9.7" stroke="#7040B8" stroke-width="0.5" opacity="0.7"/>

  <!-- 8 Orbit dots (filled circles — more readable than rings at small size) -->
  <circle cx="16" cy="6.5" r="1.8" fill="#9055D0" stroke="#0A0812" stroke-width="0.4"/>
  <circle cx="22.2" cy="9.8" r="1.8" fill="#9055D0" stroke="#0A0812" stroke-width="0.4"/>
  <circle cx="25.5" cy="16" r="1.8" fill="#9055D0" stroke="#0A0812" stroke-width="0.4"/>
  <circle cx="22.2" cy="22.2" r="1.8" fill="#9055D0" stroke="#0A0812" stroke-width="0.4"/>
  <circle cx="16" cy="25.5" r="1.8" fill="#9055D0" stroke="#0A0812" stroke-width="0.4"/>
  <circle cx="9.8" cy="22.2" r="1.8" fill="#9055D0" stroke="#0A0812" stroke-width="0.4"/>
  <circle cx="6.5" cy="16" r="1.8" fill="#9055D0" stroke="#0A0812" stroke-width="0.4"/>
  <circle cx="9.8" cy="9.8" r="1.8" fill="#9055D0" stroke="#0A0812" stroke-width="0.4"/>

  <!-- Scroll body — simple rounded rect, no text at this size -->
  <rect x="11.5" y="11" width="9" height="10" rx="1" fill="#E2C87A"/>
  <!-- Side shading -->
  <rect x="11.5" y="11" width="9" height="10" rx="1" fill="none" stroke="#A07828" stroke-width="0.4" opacity="0.5"/>

  <!-- Top curl (behind) — dark crescent shadow -->
  <path d="M11.5,12.2 Q16,10.2 20.5,12.2 L20.5,11.5 Q16,9.2 11.5,11.5 Z" fill="#7A5010" opacity="0.75"/>

  <!-- Bottom curl (toward viewer) — warm bump -->
  <path d="M11.5,20.5 Q16,22.8 20.5,20.5 L20.5,21.2 Q16,23.6 11.5,21.2 Z" fill="#C09040"/>
  <!-- Curl highlight -->
  <path d="M11.8,20.5 Q16,22.6 20.2,20.5" fill="none" stroke="#F0DC98" stroke-width="0.6" opacity="0.7"/>
</svg>
